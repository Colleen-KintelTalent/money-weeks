/* ---------- live split on the pay form ---------- */
function updateSplit(){
  const g=document.getElementById("p-goal"); if(!g) return;
  const el=document.getElementById("p-left");
  let goalDelta, spendDelta;

  if(moveMode){
    const from=val("m-from"), to=val("m-to"), amt=num(val("m-amt"));
    goalDelta  = (to==="spend"?0:amt) - (from==="spend"?0:amt);
    spendDelta = (to==="spend"?amt:0) - (from==="spend"?amt:0);
    g.textContent=(goalDelta>=0?"+":"")+money(goalDelta);
    g.className="num"+(goalDelta<0?" down":"");
    el.textContent=(spendDelta>=0?"+":"")+money(spendDelta);
    el.className="num"+(spendDelta<0?" down":"");
    return;
  }

  const amt=num(val("p-amt")), sav=num(val("p-sav"));
  let inv=0; document.querySelectorAll(".hput").forEach(i=>inv+=num(i.value));
  g.textContent=money(sav+inv); g.className="num";
  const left=amt-sav-inv;
  el.textContent=money(left);
  el.className="num"+(left<0?" down":"");
}

function download(name,text,type){
  const b=new Blob([text],{type:type||"application/json"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* GST follows the total until he types over it, and the tax-invoice warning appears
   the moment the total crosses the threshold. */
function updateGst(){
  const amt=num(val("s-amt")), g=document.getElementById("s-gst"), f=document.getElementById("rc-flag");
  if(g&&!gstTouched) g.value=noGst?"0.00":(amt>0?gstOf(amt).toFixed(2):"");
  if(f) f.hidden=!(receiptMode&&amt>NEEDS_INVOICE&&!invoiceHeld);
}
function resetReceipt(){
  receiptMode=false; noGst=false; invoiceHeld=false; gstTouched=false;
  dropPhotos();
}
function dropPhotos(){
  pendingPhotos.forEach(p=>{ if(p.url) URL.revokeObjectURL(p.url); });
  pendingPhotos=[];
  ocrJob++; ocrState=null; clearMarks();          // abandon any read still running
}
/* Reading runs on the photo at the head of the queue, one at a time, so a chain of
   four gallery photos reads the one he is filling in rather than all four at once. */
function maybeRead(){
  if(!S||!S.readReceipts) return;
  const head=pendingPhotos[0];
  if(!head||!head.file||head.readDone||head.reading) return;
  runRead(head);
}
function runRead(entry){
  entry.reading=true;
  const job=++ocrJob, stale=()=>job!==ocrJob;
  const give=msg=>{ entry.reading=false; entry.readDone=true;
    if(!stale()){ ocrState={stage:"note",msg}; showRead(); } };
  ocrState={stage:"ready",pct:0}; showRead();
  ocrReady(m=>{
    if(stale()) return;
    ocrState=(m&&m.status==="recognizing text")?{stage:"reading",pct:m.progress||0}
                                              :{stage:"ready",pct:(m&&m.progress)||0};
    showRead();
  }).then(w=>{
    if(stale()) return null;
    ocrState={stage:"reading",pct:0}; showRead();
    return readCopy(entry.file).then(b=>w.recognize(b));
  }).then(r=>{
    if(stale()||!r) return;
    entry.reading=false; entry.readDone=true;
    const conf=r.data&&typeof r.data.confidence==="number"?r.data.confidence:100;
    applyRead(conf<50?{}:parseReceipt(r.data&&r.data.text));   // too garbled to believe
  /* The ten megabytes only have to come down once, and after that the phone has them,
     so don't refuse offline — try, and only say so if it actually couldn't load. */
  }).catch(()=>give(navigator.onLine
    ? "Couldn't get the receipt reader going. Type the figures in \u2014 the photo is saved either way."
    : "You're offline and the reader hasn't downloaded yet. Type the figures in \u2014 it'll be ready next time you're on wifi."));
}
/* Nothing is filled in silently. Every field that came off the photo is marked until
   he edits it or says it looks right, because a wrong total walks into a tax claim. */
function applyRead(r){
  let any=false;
  const set=(id,v)=>{ const el=document.getElementById(id); if(!el||v==null) return;
    el.value=v; el.classList.add("photoed"); photoFilled[id]=true; any=true; };
  if(r.amount!=null) set("s-amt",r.amount.toFixed(2));
  if(r.date) set("s-date",r.date);
  updateGst();                                    // the eleventh, off the total it just read
  if(r.gst!=null){ set("s-gst",r.gst.toFixed(2)); gstTouched=true; }
  if(r.supplier) set("s-sup",r.supplier);
  ocrState=any?{stage:"filled"}
    :{stage:"note",msg:"Couldn't read anything off that one. Type it in \u2014 the photo is saved either way."};
  showRead();
}
function unmark(id){
  const el=document.getElementById(id); if(el) el.classList.remove("photoed");
  delete photoFilled[id];
  if(!Object.keys(photoFilled).length&&ocrState&&ocrState.stage==="filled"){ ocrState=null; showRead(); }
}
function clearMarks(){
  Object.keys(photoFilled).forEach(id=>{ const el=document.getElementById(id);
    if(el) el.classList.remove("photoed"); });
  photoFilled={};
}
const READ_NAMES={"s-amt":"the total","s-date":"the date","s-gst":"the GST","s-sup":"the supplier"};
function showRead(){
  const box=document.getElementById("rc-read"); if(!box) return;
  const st=ocrState;
  if(!st){ box.innerHTML=""; return; }
  if(st.stage==="ready"||st.stage==="reading"){
    box.innerHTML=`<div class="reading"><span>${st.stage==="ready"
        ? "Getting the receipt reader ready, this happens once\u2026"
        : "Reading the receipt\u2026"}</span>
      <span class="bar"><i style="width:${Math.round((st.pct||0)*100)}%"></i></span>
      <button class="link" data-act="ocr-skip">Skip</button></div>`;
  }else if(st.stage==="filled"){
    box.innerHTML=`<div class="flag">Filled in from the photo: ${
      Object.keys(photoFilled).map(id=>READ_NAMES[id]||id).join(", ")}. Check it against the docket before you save.</div>
      <button class="link" data-act="ocr-checked">Checked, it's right</button>`;
  }else box.innerHTML=`<p class="note">${esc(st.msg||"")}</p>`;
}
function showPhoto(){
  const box=document.getElementById("rc-prev"); if(!box) return;
  const p=pendingPhotos[0], more=pendingPhotos.length-1;
  box.innerHTML=p?`<img class="thumb" src="${p.url}" alt="The receipt about to be saved">
    <button class="link" data-act="unsnap">Remove this photo</button>
    <span class="subtle"> ${Math.round(p.blob.size/1024)}KB</span>
    ${more>0?`<p class="note">${more} more photo${more>1?"s":""} waiting. Each one gets its own expense \u2014 fill
      this one in, add it, and the next photo comes up.</p>`:""}`:"";
}

function wire(){
  document.querySelectorAll(".pcalc").forEach(i=>i.addEventListener("input",updateSplit));
  const mf=document.getElementById("m-from"), mt=document.getElementById("m-to");
  if(mf) mf.addEventListener("change",()=>{ moveFrom=mf.value; });
  if(mt) mt.addEventListener("change",()=>{ moveTo=mt.value; });
  updateSplit();

  const sa=document.getElementById("s-amt"), sg=document.getElementById("s-gst");
  if(sa) sa.addEventListener("input",()=>{ unmark("s-amt"); updateGst(); });
  if(sg) sg.addEventListener("input",()=>{ gstTouched=true; unmark("s-gst"); });
  const sd=document.getElementById("s-date"), su=document.getElementById("s-sup");
  if(sd) sd.addEventListener("input",()=>unmark("s-date"));
  if(su) su.addEventListener("input",()=>unmark("s-sup"));
  showPhoto(); showRead(); updateGst();

  /* The camera hands back one photo, the gallery can hand back several. Both land in the
     same queue, one at a time — decoding a phoneful of 4MB images at once runs a phone
     out of memory, and the preview fills in as each one is done. */
  const takePhotos=e=>{
    const files=Array.prototype.slice.call(e.target.files||[]); e.target.value="";
    if(!files.length) return;
    toast(files.length===1?"Shrinking the photo\u2026":"Shrinking "+files.length+" photos\u2026");
    let bad=0;
    files.reduce((p,f)=>p.then(()=>compress(f)
      .then(b=>{ pendingPhotos.push({blob:b,url:URL.createObjectURL(b),file:f}); showPhoto(); maybeRead(); })
      .catch(()=>{ bad++; })), Promise.resolve())
      .then(()=>{ if(bad) toast(bad===files.length?"Couldn't read that photo"
        :"Couldn't read "+bad+" of those photos"); });
  };
  ["rc-file","rc-pick"].forEach(id=>{ const el=document.getElementById(id);
    if(el) el.addEventListener("change",takePhotos); });

  const hs=document.getElementById("h-search");
  if(hs) hs.addEventListener("input",()=>{ histSearch=hs.value;
    const body=document.getElementById("hist-body"); if(body) body.innerHTML=histBody(); });

  /* Stored receipts load out of IndexedDB after the view is on screen. */
  document.querySelectorAll("img[data-photo]").forEach(img=>{
    const id=img.dataset.photo;
    if(photoUrls[id]){ img.src=photoUrls[id]; return; }
    photoGet(id).then(b=>{
      if(b){ photoUrls[id]=URL.createObjectURL(b); img.src=photoUrls[id]; }
      else{ const n=document.createElement("div"); n.className="subtle";
        n.textContent="That photo isn't on this device."; img.replaceWith(n); }
    }).catch(()=>{ const n=document.createElement("div"); n.className="subtle";
      n.textContent="This browser won't open stored photos."; img.replaceWith(n); });
  });

  const rf=document.getElementById("restore-file");
  if(rf) rf.addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(data&&data.type==="money-weeks-receipts"&&data.photos){
        const ids=Object.keys(data.photos);
        Promise.all(ids.map(id=>photoPut(id,dataToBlob(data.photos[id]))))
          .then(()=>{ photoUrls={}; render(); toast(ids.length+" receipt photos restored"); })
          .catch(()=>toast("This browser wouldn't store the photos"));
        return;
      }
      if(!data.goal||!data.income) throw new Error("bad");
      S=migrate(data); save(); render();
      toast("Figures restored. Receipt photos come in their own file.");
    }catch(err){ toast("That isn't a Money Weeks backup"); } };
    r.readAsText(f);
  });
}

const photosIn=fy=>S?S.expenses.filter(e=>e.photo&&(fy==="all"||fyOf(e.date)===+fy)):[];
const photoCount=fy=>photosIn(fy===undefined?"all":fy).length;
/* Which financial years actually hold photos, newest first. */
const photoYears=()=>{ const y=[]; photosIn("all").forEach(e=>{ const f=fyOf(e.date);
  if(y.indexOf(f)<0) y.push(f); }); return y.sort().reverse(); };

function readHoldLines(sel){
  return Array.prototype.map.call(document.querySelectorAll(sel+" .line"),el=>({
    id:el.dataset.id, name:el.querySelector(".hold-name").value.trim()
  })).filter(h=>h.name);
}

document.getElementById("app").addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]"); if(!btn) return;
  const act=btn.dataset.act;

  if(act==="setup-add-hold"||act==="add-hold"){
    document.getElementById(act==="setup-add-hold"?"setup-holds":"set-holds")
      .insertAdjacentHTML("beforeend",holdLine({id:uid(),name:""}));
    return;
  }
  if(act==="del-hold"){ btn.closest(".line").remove(); return; }

  if(act==="start"){
    const sav=num(val("u-sav")), wal=num(val("u-wal"));
    S={goal:num(val("u-goal")), deadline:val("u-date"), payDay:parseInt(val("u-payday"),10)||0,
       readReceipts:true, categories:DEFAULT_CATS, holdings:readHoldLines("#setup-holds"),
       income:[], expenses:[], recurring:[], owed:[], repayments:[], investValues:[], adjustments:[]};
    if(sav||wal) S.income.push({id:uid(), date:today(), amount:sav+wal, toSavings:sav, invest:{}, opening:true});
    save(); tab = S.holdings.length ? "goal" : "pay"; render();
    checkPersist(true);                      // after setup, not on first paint
    if(S.holdings.length) toast("Now put in what each investment is worth");
    return;
  }
  if(act==="tab"){ tab=btn.dataset.tab; moveMode=false; movePrefill=null; spendSub=null;
    openRows={}; render();
    /* Existing saves never got asked at setup, so ask the first time he opens the tab
       where the answer is shown. Already answered, this only re-reads the status. */
    if(tab==="setup") checkPersist(S.persisted===undefined);
    return; }
  if(act==="move-mode"){ moveMode=!moveMode; if(!moveMode) movePrefill=null; render(); return; }
  if(act==="sweep"){
    const d=derive();
    movePrefill=Math.max(0,d.safe); moveFrom="spend"; moveTo="save"; moveMode=true; tab="pay"; render();
    toast("Change the amount if you don't want all of it"); return;
  }

  if(act==="save-move"){
    const d=derive(), from=val("m-from"), to=val("m-to"), amt=num(val("m-amt"));
    if(amt<=0){ toast("How much?"); return; }
    if(from===to){ toast("Pick two different places"); return; }

    const nameOf=id=>id==="spend"?"Spending":id==="save"?"Savings":
      ((S.holdings.find(h=>h.id===id)||{}).name||"Investment");
    const availableIn=id=>id==="spend"?d.safe:id==="save"?d.savings:
      ((d.holdings.find(x=>x.h.id===id)||{}).value||0);
    if(amt>availableIn(from)+0.005){
      toast("Only "+money(availableIn(from))+" in "+nameOf(from)); return; }

    /* A move is just an allocation entry with a minus on one side. */
    const entry={id:uid(), date:val("p-date")||today(), amount:0, toSavings:0, invest:{},
      moveLabel:money(amt)+": "+nameOf(from)+" to "+nameOf(to)};
    if(from==="save") entry.toSavings-=amt;
    else if(from!=="spend") entry.invest[from]=(entry.invest[from]||0)-amt;
    if(to==="save") entry.toSavings+=amt;
    else if(to!=="spend") entry.invest[to]=(entry.invest[to]||0)+amt;

    S.income.push(entry);
    save(); moveMode=false; movePrefill=null; render();
    toast(nameOf(from)+" to "+nameOf(to)); return;
  }
  if(act==="save-pay"){
    const sav=num(val("p-sav")), amt=num(val("p-amt"));
    const invest={}; let inv=0;
    document.querySelectorAll(".hput").forEach(i=>{
      const v=num(i.value); if(v){ invest[i.dataset.hid]=v; inv+=v; } });
    if(!amt&&!sav&&!inv){ toast("Nothing to save yet"); return; }
    if(sav+inv>amt){ toast("You're setting aside more than came in"); return; }
    S.income.push({id:uid(), date:val("p-date")||today(), amount:amt, toSavings:sav, invest:invest});
    save(); render(); toast("Saved"); return;
  }
  if(act==="del-pay"){ S.income=S.income.filter(i=>i.id!==btn.dataset.id); save(); render(); return; }

  if(act==="receipt-mode"){
    receiptMode=!receiptMode;
    const block=document.getElementById("rc-block");
    if(block) block.hidden=!receiptMode;
    btn.textContent=receiptMode?"Not a work receipt after all":"It's a work receipt \u2014 photo and GST";
    /* Work spending is nearly always the work category, so put him there without a fuss. */
    if(receiptMode&&S.categories.some(c=>c.id==="work")){
      const chips=document.querySelectorAll('#s-cats .chip');
      chips.forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.id==="work")));
    }
    updateGst(); return;
  }
  if(act==="no-gst"){
    noGst=!noGst; btn.setAttribute("aria-pressed",String(noGst));
    gstTouched=false; updateGst(); return;
  }
  if(act==="held"){
    invoiceHeld=!invoiceHeld; btn.setAttribute("aria-pressed",String(invoiceHeld)); updateGst(); return;
  }
  if(act==="snap"){ const f=document.getElementById("rc-file"); if(f) f.click(); return; }
  if(act==="pick-photo"){ const f=document.getElementById("rc-pick"); if(f) f.click(); return; }
  if(act==="ocr-skip"){
    ocrJob++;                                     // anything still running is now ignored
    const h=pendingPhotos[0]; if(h){ h.reading=false; h.readDone=true; }
    ocrState=null; showRead(); return;
  }
  if(act==="ocr-checked"){ clearMarks(); ocrState=null; showRead(); return; }
  if(act==="unsnap"){
    const p=pendingPhotos.shift();
    if(p&&p.url) URL.revokeObjectURL(p.url);
    ocrJob++; ocrState=null; clearMarks();
    showPhoto(); showRead(); maybeRead(); return;
  }

  if(act==="pick-cat"||act==="pick-rcat"){
    btn.closest(".chips").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true"); return;
  }
  if(act==="add-exp"){
    const a=num(val("s-amt")); if(a<=0){ toast("Put an amount in first"); return; }
    const p=document.querySelector('#s-cats .chip[aria-pressed="true"]');
    const cat=p?p.dataset.id:S.categories[0].id;
    const e2={id:uid(), date:val("s-date")||today(), amount:a,
      what:val("s-what").trim()||catOf(cat).name, cat};
    if(receiptMode){
      e2.claimable=true;
      e2.supplier=val("s-sup").trim()||e2.what;
      e2.noGst=noGst;
      e2.gst=noGst?0:Math.round(num(val("s-gst"))*100)/100;
      e2.invoiceHeld=invoiceHeld;
      /* Which figures came off the photo and were never looked at. The claimable list
         shows these, so an unchecked total can be found again later. */
      const left=Object.keys(photoFilled).map(id=>READ_NAMES[id]).filter(Boolean);
      if(left.length) e2.readFields=left;
    }
    const shot=receiptMode&&pendingPhotos.length?pendingPhotos.shift():null;
    const done=m=>{
      if(shot&&shot.url) URL.revokeObjectURL(shot.url);
      /* Photos still queued each want their own figures, so the form stays open for the next one. */
      const left=receiptMode?pendingPhotos.length:0;
      if(left){ noGst=false; invoiceHeld=false; gstTouched=false; ocrState=null; photoFilled={}; }
      else resetReceipt();
      save(); render();
      if(left) maybeRead();                       // the next photo's turn has come up
      toast(left?m+" \u2014 "+left+" photo"+(left>1?"s":"")+" to go":m);
    };
    S.expenses.push(e2);
    if(shot){
      e2.photo=true;
      photoPut(e2.id,shot.blob).then(()=>done("Receipt saved"))
        .catch(()=>{ delete e2.photo; done("Saved, but this browser wouldn't keep the photo"); });
    }else done(receiptMode?"Receipt saved":"Added");
    return;
  }
  if(act==="del-exp"){
    const gone=S.expenses.find(x=>x.id===btn.dataset.id);
    if(gone&&gone.photo){ photoDel(gone.id).catch(()=>{});
      if(photoUrls[gone.id]){ URL.revokeObjectURL(photoUrls[gone.id]); delete photoUrls[gone.id]; } }
    S.expenses=S.expenses.filter(x=>x.id!==btn.dataset.id); save(); render(); return; }
  if(act==="again-exp"){ const e2=S.expenses.find(x=>x.id===btn.dataset.id);
    /* Same shop, same amount, today — but its own receipt, so the photo doesn't come along. */
    if(e2){ const copy=Object.assign({},e2,{id:uid(),date:today()});
      delete copy.photo; delete copy.invoiceHeld;
      S.expenses.push(copy); save(); render(); toast("Logged again"); } return; }
  if(act==="held-toggle"){
    const e2=S.expenses.find(x=>x.id===btn.dataset.id);
    if(e2){ e2.invoiceHeld=!e2.invoiceHeld; save(); render(); } return; }
  if(act==="claim"){ spendSub="claim"; openRows={}; render(); return; }
  if(act==="unclaim"){ spendSub=null; openRows={}; render(); return; }
  if(act==="fy"){ claimFY=btn.dataset.id; render(); return; }
  if(act==="claim-csv"){
    const all=S.expenses.filter(e=>e.claimable&&(claimFY==="all"||fyOf(e.date)===+claimFY))
      .sort((a,b)=>a.date<b.date?-1:1);
    const rows=[["Date","Supplier","Description","Total","GST","Tax invoice held"]].concat(
      all.map(e=>[e.date, e.supplier||"", e.what, e.amount.toFixed(2), (e.gst||0).toFixed(2),
        e.amount>NEEDS_INVOICE?(e.invoiceHeld?"Yes":"No"):"Not required"]));
    download("claimable-"+(claimFY==="all"?"all":fyLabel(+claimFY))+"-"+today()+".csv",
      rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");
    toast("Downloaded"); return;
  }
  if(act==="filter"){ filter=btn.dataset.id||null; render(); return; }
  if(act==="hfilter"){ histFilter=btn.dataset.id; render(); return; }
  if(act==="toggle-hist"){ const w=btn.dataset.week;
    openHist[w]=!(openHist[w]??(btn.getAttribute("aria-expanded")==="true")); render(); return; }
  if(act==="toggle-row"){ const id=btn.dataset.id; openRows[id]=!openRows[id]; render(); return; }
  if(act==="reconcile"){
    const d=derive();
    const said=prompt("How much have you actually got left to spend?", Math.max(0,d.safe).toFixed(2));
    if(said===null) return;
    const diff=d.safe-num(said);
    if(!diff){ toast("Already matches"); return; }
    S.expenses.push({id:uid(), date:today(), amount:diff, what:"Adjustment", cat:"other"});
    save(); render(); toast("Squared up"); return;
  }
  if(act==="csv"){
    const rows=[["Date","What","Category","Amount"]].concat(S.expenses.slice()
      .sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.date,e.what,catOf(e.cat).name,e.amount.toFixed(2)]));
    download("spending-"+today()+".csv",
      rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");
    toast("Downloaded"); return;
  }

  if(act==="show-regulars"){ showRegulars=!showRegulars; render(); return; }
  if(act==="add-rec"){
    const a=num(val("r-amt")), n=val("r-name").trim();
    if(!n||a<=0){ toast("Needs a name and an amount"); return; }
    const p=document.querySelector('#r-cats .chip[aria-pressed="true"]');
    S.recurring.push({id:uid(), name:n, amount:a, freq:val("r-freq"),
      next:val("r-next")||today(), cat:p?p.dataset.id:"bills"});
    save(); render(); toast("Bill saved"); return;
  }
  if(act==="del-rec"){ S.recurring=S.recurring.filter(r=>r.id!==btn.dataset.id); save(); render(); return; }
  if(act==="log-due"||act==="skip-due"){
    const item=dueList()[parseInt(btn.dataset.i,10)]; if(!item) return;
    const r=S.recurring.find(x=>x.id===item.r.id);
    if(act==="log-due") S.expenses.push({id:uid(), date:item.date, amount:r.amount, what:r.name, cat:r.cat, bill:true});
    r.next=advance(item.date,r.freq); save(); render();
    toast(act==="log-due"?"Paid":"Skipped"); return;
  }
  if(act==="log-all-due"){
    dueList().forEach(item=>{ const r=S.recurring.find(x=>x.id===item.r.id);
      S.expenses.push({id:uid(), date:item.date, amount:r.amount, what:r.name, cat:r.cat, bill:true});
      r.next=advance(item.date,r.freq); });
    save(); render(); toast("All logged"); return;
  }

  if(act==="fix-savings"){
    const d=derive(), said=val("sav-real");
    if(said.trim()===""){ toast("Type what's actually in the account"); return; }
    const real=num(said), diff=Math.round((real-d.savings)*100)/100;
    if(!diff){ toast("Already matches"); return; }
    /* The delta is stored, never the new total, so the history behind it stays intact
       and the correction can be deleted like anything else. */
    S.adjustments.push({id:uid(), date:today(), amount:diff,
      note:"Corrected from "+money(d.savings,true)+" to "+money(real,true)});
    save(); render(); toast(diff>0?money(diff,true)+" added":money(-diff,true)+" taken off"); return;
  }
  if(act==="del-adj"){ S.adjustments=S.adjustments.filter(a=>a.id!==btn.dataset.id); save(); render(); return; }
  if(act==="del-val"){ S.investValues=S.investValues.filter(v=>v.id!==btn.dataset.id); save(); render(); return; }

  if(act==="save-values"){
    const date=val("v-date")||today(); let n=0;
    document.querySelectorAll(".vput").forEach(i=>{
      const v=num(i.value); if(v>0){ S.investValues.push({id:uid(), date, hid:i.dataset.hid, value:v}); n++; } });
    if(!n){ toast("Nothing typed in"); return; }
    S.investValues.sort((a,b)=>a.date<b.date?-1:1);
    save(); render(); toast(n===1?"Updated":n+" updated"); return;
  }

  if(act==="add-owed"){
    const w=val("o-who").trim(), a=num(val("o-amt"));
    if(!w||a<=0){ toast("Needs a name and an amount"); return; }
    S.owed.push({id:uid(), who:w, amount:a}); save(); render(); return;
  }
  if(act==="repaid"){
    const o=S.owed.find(x=>x.id===btn.dataset.id); if(!o) return;
    const said=prompt("How much did "+o.who+" pay back?", o.amount.toFixed(2));
    if(said===null) return;
    const a=num(said); if(a<=0) return;
    S.repayments.push({id:uid(), date:today(), who:o.who, amount:a});
    o.amount=Math.max(0,o.amount-a);
    if(o.amount===0) S.owed=S.owed.filter(x=>x.id!==o.id);
    save(); render(); toast(money(a)+" into savings"); return;
  }
  if(act==="del-owed"){ S.owed=S.owed.filter(o=>o.id!==btn.dataset.id); save(); render(); return; }
  if(act==="del-repaid"){ S.repayments=S.repayments.filter(r=>r.id!==btn.dataset.id); save(); render(); return; }

  if(act==="del-cat"){ btn.closest(".line").remove(); return; }
  if(act==="add-cat"){
    document.getElementById("set-cats").insertAdjacentHTML("beforeend",
      `<div class="line" data-id="${uid()}"><span class="sw" style="background:#8c9aa3"></span>
       <input class="nm cat-name" value="" placeholder="Category name" aria-label="Category name">
       <button class="x" data-act="del-cat" aria-label="Remove">&times;</button></div>`);
    return;
  }
  if(act==="save-settings"){
    S.goal=num(val("g-goal")); S.deadline=val("g-date");
    S.payDay=parseInt(val("g-payday"),10)||0;
    S.holdings=readHoldLines("#set-holds");
    const keep={}; S.holdings.forEach(h=>keep[h.id]=1);
    S.investValues=S.investValues.filter(v=>keep[v.hid]);          // drop history for removed holdings
    S.categories=Array.prototype.map.call(document.querySelectorAll("#set-cats .line"),el=>{
      const old=S.categories.find(c=>c.id===el.dataset.id);
      return {id:el.dataset.id, name:el.querySelector(".cat-name").value.trim(),
        color:old?old.color:"#8c9aa3"};
    }).filter(c=>c.name);
    save(); render(); toast("Saved"); return;
  }
  if(act==="backup"){
    const f=figuresFile();
    download(f.name,f.text);
    if(S) markFiguresBackedUp();
    toast(photoCount()?"Figures saved. Photos are a separate file.":"Backup downloaded"); return; }
  if(act==="share-backup"){ shareFile(figuresFile(),markFiguresBackedUp); return; }
  if(act==="hush-nudge"){ nudgeHushed=true; render(); return; }
  if(act==="read-toggle"){
    S.readReceipts=!S.readReceipts; save(); render();
    toast(S.readReceipts?"Receipts will be read from the photo":"Reading turned off, nothing will download");
    return; }
  if(act==="photo-fy"){ photoFY=btn.dataset.id; render(); return; }
  if(act==="backup-photos"||act==="share-photos"){
    const fy=act==="share-photos"&&btn.dataset.fy?btn.dataset.fy:photoFY;
    const sending=act==="share-photos";
    if(!photosIn(fy).length){ toast(fy==="all"?"No receipt photos yet":"No receipt photos in that year"); return; }
    toast("Gathering "+photosIn(fy).length+" photos\u2026");
    photosFile(fy).then(file=>{
      if(!file){ toast("Couldn't read the photos back"); return; }
      if(sending) shareFile(file,()=>markPhotosBackedUp(fy));
      else{
        download(file.name,file.text);
        markPhotosBackedUp(fy);
        toast(file.n+" receipt photos downloaded"+(fy==="all"?"":", "+fyLabel(+fy)));
      }
    }).catch(()=>toast("Couldn't read the photos back"));
    return; }
  if(act==="restore"){ document.getElementById("restore-file").click(); return; }
  if(act==="ask-wipe"){ confirmWipe=true; render(); return; }
  if(act==="cancel-wipe"){ confirmWipe=false; render(); return; }
  if(act==="wipe"){ localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY);
    if(S) S.expenses.forEach(e=>{ if(e.photo) photoDel(e.id).catch(()=>{}); });
    photoUrls={}; S=null; confirmWipe=false; tab="pay"; spendSub=null; render(); return; }
});

probeStorage(); probeShare(); load(); render();

/* Works offline once installed. Skipped harmlessly when opened as a local file. */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
