<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142433">
<title>Money Weeks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap');
:root{--ink:#142433;--ink-2:#3d5163;--paper:#e3e8ea;--card:#fff;--hv:#f5c518;
  --ahead:#176b5c;--behind:#b23f2a;--line:#c6d0d5}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);
  color:var(--ink);font-size:16px;line-height:1.45;padding:14px 12px calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto}
.num{font-family:'Barlow Condensed','Barlow',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.hero{background:var(--ink);color:#fff;border-radius:6px 6px 0 0;padding:18px 16px 14px}
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.total{font-size:46px;font-weight:600;line-height:.95}
.of{color:#93a7b6;font-size:15px;margin-top:2px}
.countdown{text-align:right;color:var(--hv);font-size:15px;font-weight:500;line-height:1.2}
.countdown b{display:block;font-size:28px;font-weight:600}
.verdict{margin-top:14px;padding-top:12px;border-top:1px solid #2b4054}
.verdict-main{font-size:17px;font-weight:600}
.verdict-sub{color:#93a7b6;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.bars-box{margin-top:16px}
.bars{position:relative;display:flex;align-items:flex-end;gap:4px;height:76px;border-bottom:1px solid #2b4054}
.bar{flex:1;background:var(--hv);border-radius:1px 1px 0 0;min-height:2px}
.target{position:absolute;left:0;right:0;border-top:1px dashed #7f96a8;pointer-events:none}
.target span{position:absolute;right:0;top:-17px;font-size:12px;color:#93a7b6;background:var(--ink);padding-left:5px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:#7f96a8;margin-top:5px}
.hint{color:#7f96a8;font-size:14px;padding-top:4px}

.wallet{background:var(--hv);border-radius:0 0 6px 6px;padding:14px 16px}
.wallet-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wallet .lbl{font-size:15px;font-weight:600;color:#4a3c05}
.wallet .amt{font-size:34px;font-weight:600;color:var(--ink)}
.wallet .sub{font-size:13px;color:#5c4c10;margin:2px 0 0}
.wallet.over{background:#e0836b}
.wallet.over .lbl,.wallet.over .sub{color:#4a1a10}
.sweep{width:100%;margin-top:10px;padding:10px;font-size:15px;font-weight:600;border-radius:4px;
  border:1px solid rgba(20,36,51,.35);background:rgba(255,255,255,.5);color:var(--ink);cursor:pointer;font-family:inherit}
.sweep:active{background:rgba(255,255,255,.85)}

.tabs{display:flex;gap:4px;margin-top:12px;background:#d3dade;padding:4px;border-radius:5px}
.tab{flex:1;padding:10px 1px;font-size:13px;font-weight:500;border:0;border-radius:3px;background:transparent;
  color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,36,51,.12)}

.card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:14px;margin-top:12px}
.card.due{border-color:#e0c99a;background:#fffdf6}
h2{font-size:18px;font-weight:600;margin:0 0 2px}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 12px}
.note{font-size:14px;color:var(--ink-2);margin-top:10px}
.empty{text-align:center;color:var(--ink-2);padding:18px 6px;font-size:15px}

.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eef1f2}
.row:last-of-type{border-bottom:0}
.row label{flex:1;font-size:16px}
.row.indent label{padding-left:16px;font-size:15px;color:var(--ink-2)}
.money{position:relative;width:148px}
.money>span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#8b9aa5}
input,select{font-family:inherit;color:var(--ink)}
.in{width:100%;padding:11px 10px 11px 22px;font-size:18px;text-align:right;border:1px solid var(--line);
  border-radius:4px;background:#fbfcfc;font-variant-numeric:tabular-nums}
.in.plain{padding-left:10px;text-align:left;font-size:16px}
.in:focus,.txt:focus,.sel:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.txt{width:100%;padding:11px 10px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:#fbfcfc}
.sel{width:100%;padding:11px 8px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:#fbfcfc}

.split{margin-top:12px;padding:12px;background:#f2f5f6;border-radius:4px}
.splitline{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.splitline.big{font-size:17px;font-weight:600;border-top:1px solid #dde3e6;margin-top:6px;padding-top:8px}
.btn{width:100%;margin-top:12px;padding:14px;font-size:17px;font-weight:600;background:var(--ink);color:#fff;
  border:0;border-radius:4px;cursor:pointer;font-family:inherit}
.btn:active{background:#0c1926}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--behind);border:1px solid #e0c3bc}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:15px;
  padding:4px 0;font-family:inherit}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{padding:8px 12px;font-size:15px;border:1px solid var(--line);border-radius:20px;background:#fbfcfc;
  color:var(--ink-2);cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

.weekhead{display:flex;align-items:baseline;gap:8px;width:100%;padding:12px 0 8px;background:none;border:0;
  border-top:1px solid #eef1f2;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.weekhead:first-of-type{border-top:0}
.weekname{flex:1;font-size:16px;font-weight:600}
.weeksum{font-size:18px;font-weight:600}
.caret{color:#9aa8b1;font-size:13px;width:12px}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:10px;background:#eef1f2}

.exp{display:flex;align-items:center;gap:10px;padding:8px 0 8px 4px;border-bottom:1px solid #f4f6f7}
.exp:last-child{border-bottom:0}
.expmain{flex:1;min-width:0}
.expwhat{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expmeta{font-size:13px;color:var(--ink-2)}
.expamt{font-size:17px;font-weight:500}
.x{background:none;border:0;color:#9aa8b1;font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.again{background:none;border:0;color:#7d8f9a;font-size:16px;cursor:pointer;padding:0 2px}
.mini{padding:7px 12px;font-size:14px;font-weight:600;border-radius:4px;border:1px solid var(--line);
  background:#fbfcfc;color:var(--ink);cursor:pointer;font-family:inherit}
.mini.solid{background:var(--ink);color:#fff;border-color:var(--ink)}

.big{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0}
.big .k{font-size:16px;color:var(--ink-2)}
.big .v{font-size:26px;font-weight:600}
.hold{padding:12px 0;border-bottom:1px solid #eef1f2}
.hold:last-of-type{border-bottom:0}
.holdhead{display:flex;align-items:baseline;gap:10px}
.holdname{flex:1;font-size:16px;font-weight:600}
.holdval{font-size:21px;font-weight:600}
.holdchg{font-size:15px;font-weight:600;width:90px;text-align:right}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin:8px 0 2px}
.spark div{flex:1;background:#dbe2e5;border-radius:1px 1px 0 0;min-height:2px}
.spark div.last{background:var(--ink)}
.up{color:var(--ahead)} .down{color:var(--behind)}

.line{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.line input.nm{flex:1;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:#fbfcfc}
.title{font-size:26px;font-weight:600;margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:4px;font-size:15px;z-index:9;box-shadow:0 3px 12px rgba(20,36,51,.3)}

.subtle{font-size:13px;color:var(--ink-2)}
/* Filled in from a photo and not yet looked at. Loud on purpose: a wrong total
   here walks straight into a tax claim. */
.photoed{background:#fff7e6;border-color:#e8d5a8;box-shadow:inset 0 0 0 1px #e8d5a8}
/* At 380px the "getting ready" line fills the row on its own, so the bar and Skip
   wrap underneath rather than the bar being squeezed to nothing. */
.reading{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;
  gap:8px 10px;margin-top:10px}
.reading .bar{flex:1 1 120px;min-width:110px;height:4px;background:var(--line);
  border-radius:2px;overflow:hidden}
.reading .bar i{display:block;height:100%;background:var(--ink);transition:width .2s}
.flag{font-size:14px;color:#7a4d12;background:#fff7e6;border:1px solid #e8d5a8;border-radius:4px;
  padding:8px 10px;margin-top:10px}
.thumb{display:block;width:100%;max-height:240px;object-fit:contain;background:#f2f5f6;
  border:1px solid var(--line);border-radius:4px;margin-top:9px}
.hrow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 2px;border:0;border-bottom:1px solid #f4f6f7;
  background:none;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer}
.hdate{font-size:13px;color:var(--ink-2);width:50px;flex:none}
.hwhat{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamt{font-size:16px;font-weight:500;flex:none}
.hdet{padding:9px 10px 12px 32px;background:#f7f9fa;border-bottom:1px solid #f4f6f7}
.weeksub{display:block;font-size:13px;font-weight:400;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const KEY = "moneyweeks:v4";
const OLD_KEY = "moneyweeks:v3";

const DEFAULT_CATS = [
  {id:"food", name:"Food & drink",    color:"#f5c518"},
  {id:"fuel", name:"Fuel & travel",   color:"#2f8f7d"},
  {id:"bills",name:"Bills",           color:"#4a6d8c"},
  {id:"fun",  name:"Fun",             color:"#8a6bbf"},
  {id:"work", name:"Work, claimable", color:"#b23f2a"},
  {id:"other",name:"Other",           color:"#8c9aa3"}
];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

let S=null, tab="pay", filter=null, confirmWipe=false, showRegulars=false,
    moveMode=false, movePrefill=null, moveFrom="spend", moveTo="save", storageOK=true;
/* receipt form state, kept out of the DOM so a re-render never loses a photo.
   pendingPhotos is a queue: the first is the one being filled in, the rest wait their turn. */
let receiptMode=false, noGst=false, invoiceHeld=false, gstTouched=false, pendingPhotos=[];
/* history and claimable views */
let spendSub=null, claimFY="all", histFilter="all", histSearch="", openHist={}, openRows={};
let photoFY="all";                       // which year of receipt photos the export button will take
/* reading receipts: ocrState drives the progress line, photoFilled marks the fields
   that came off the photo and have not been checked by hand yet */
let ocrState=null, photoFilled={}, ocrJob=0;
/* hushed for this session only — the reminder is a card he can scroll past,
   never a thing that has to be dealt with before he can use the app */
let nudgeHushed=false, shareOK=false;
let idbOK=true, photoUrls={};

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const money=(n,c)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-AU",
  {minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});
/* Dates are plain local calendar days. toISOString() would convert to UTC first,
   which rolls back a day everywhere east of Greenwich — his own timezone included. */
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>isoLocal(new Date());
const shortDate=i=>new Date(i+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const weeksBetween=(a,b)=>Math.max(0,Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/(7*864e5)));
const addDays=(i,n)=>{const d=new Date(i+"T00:00:00");d.setDate(d.getDate()+n);return isoLocal(d)};
const addMonths=(i,n)=>{const d=new Date(i+"T00:00:00"),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));
  return isoLocal(d)};
const advance=(i,f)=>f==="weekly"?addDays(i,7):f==="fortnightly"?addDays(i,14):addMonths(i,1);
const freqLabel=f=>f==="weekly"?"every week":f==="fortnightly"?"every fortnight":"every month";
const defaultDeadline=()=>{const n=new Date();const y=(n.getMonth()===11&&n.getDate()>25)?n.getFullYear()+1:n.getFullYear();return y+"-12-25"};
const val=id=>(document.getElementById(id)||{}).value||"";
const catOf=id=>(S.categories||[]).find(c=>c.id===id)||{name:"Other",color:"#8c9aa3"};

/* His pay week runs from payday to the day before the next one. */
const payDay=()=>(S&&typeof S.payDay==="number")?S.payDay:3;      // 3 = Wednesday
const weekEnd=i=>{ const endDay=(payDay()+6)%7; const d=new Date(i+"T00:00:00");
  d.setDate(d.getDate()+((endDay-d.getDay()+7)%7)); return isoLocal(d); };
const lastPayday=()=>{ const d=new Date(today()+"T00:00:00");
  d.setDate(d.getDate()-((d.getDay()-payDay()+7)%7)); return isoLocal(d); };

/* Real detection, not a guess from the platform: Safari on iPhone shares files and
   Chrome on iPhone does not, and no user agent string tells you that reliably. */
function probeShare(){
  try{
    const f=new File(["{}"],"probe.json",{type:"application/json"});
    shareOK=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}));
  }catch(e){ shareOK=false; }
}
/* Ask the browser to treat this data as worth keeping, so it isn't evicted when the
   phone fills up. Asked once after setup, never on first paint, and the answer is
   reported honestly in Setup rather than dressed up. */
function checkPersist(ask){
  if(!S) return;
  if(!navigator.storage||!navigator.storage.persisted){
    if(S.persisted!==null){ S.persisted=null; save(); }
    return;
  }
  navigator.storage.persisted().then(has=>{
    if(has) return true;
    if(!ask) return false;
    return navigator.storage.persist();
  }).then(got=>{
    if(S&&S.persisted!==got){ S.persisted=got; save(); render(); }
  }).catch(()=>{});
}
function probeStorage(){
  try{ localStorage.setItem("__p","1"); storageOK=localStorage.getItem("__p")==="1"; localStorage.removeItem("__p"); }
  catch(e){ storageOK=false; }
}

/* Older saves had one lump of "investments". Give it a holding so nothing is lost. */
function migrate(o){
  if(!o) return o;
  if(!o.holdings){
    const hid=uid();
    o.holdings=[{id:hid,name:"Investments"}];
    o.income=(o.income||[]).map(i=>Object.assign({},i,
      {invest: i.toInvest ? (function(m){m[hid]=i.toInvest;return m})({}) : {}}));
    o.investValues=(o.investValues||[]).map(v=>Object.assign({},v,{hid:hid}));
  }
  if(typeof o.payDay!=="number") o.payDay=3;
  if(typeof o.readReceipts!=="boolean") o.readReceipts=true;   // reading photos is on unless turned off
  /* Backup bookkeeping. Counting entries at the moment of a backup is what lets the
     reminder say what is actually at stake rather than "it has been a while". */
  if(typeof o.lastBackupN!=="number") o.lastBackupN=o.lastBackup?entriesIn(o):0;
  if(typeof o.lastPhotoBackupN!=="number") o.lastPhotoBackupN=0;
  delete o.receiptPhotos;                 // a note to whoever opens the backup file, not state
  /* Saves from before savings corrections existed simply have no list yet. */
  const st=Object.assign({income:[],expenses:[],recurring:[],owed:[],repayments:[],
    investValues:[],holdings:[],adjustments:[],categories:DEFAULT_CATS},o);
  if(!Array.isArray(st.adjustments)) st.adjustments=[];
  return st;
}
function load(){
  try{
    let r=localStorage.getItem(KEY);
    if(!r){ r=localStorage.getItem(OLD_KEY); if(r){ S=migrate(JSON.parse(r)); save(); return; } }
    if(r) S=migrate(JSON.parse(r));
  }catch(e){ S=null; }
}
function save(){ if(!storageOK) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ storageOK=false; } }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m;
  t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

const investOf=i=>{ let t=0; const m=i.invest||{}; for(const k in m) t+=m[k]; return t; };

/* ---------- receipt photos ----------
   Photos are blobs, and localStorage is a ~5MB string store — a handful of them would
   blow it and take every figure down with it. So they live in IndexedDB, keyed by the
   expense id, and nothing else about the app changes. If IndexedDB is blocked the
   expense still saves, just without the picture, and it says so.
   The seam for reading a receipt automatically is compress() -> a blob: hand that blob
   to an OCR step later and fill the form from what comes back. Deliberately not built:
   a cloud vision API means his receipts leave the phone, and an in-browser one is
   megabytes of download that struggles with crumpled thermal paper. */
const IDB_NAME="moneyweeks-receipts", IDB_STORE="photos";
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!idbOK||!self.indexedDB){ idbOK=false; rej(); return; }
    let rq; try{ rq=indexedDB.open(IDB_NAME,1); }catch(e){ idbOK=false; rej(); return; }
    rq.onupgradeneeded=()=>{ const db=rq.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>{ idbOK=false; rej(rq.error); };
  });
}
function idbDo(mode,fn){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    let rq; try{ rq=fn(db.transaction(IDB_STORE,mode).objectStore(IDB_STORE)); }
    catch(e){ rej(e); return; }
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  }));
}
const photoPut=(id,blob)=>idbDo("readwrite",st=>st.put(blob,id));
const photoGet=id=>idbDo("readonly",st=>st.get(id));
const photoDel=id=>idbDo("readwrite",st=>st.delete(id));

/* A phone camera hands back 4MB. Down to the long edge at 1600px and quality 0.7 a
   receipt lands nearer 200KB, still easily readable. The reader asks for a bigger,
   sharper copy than that — see readCopy() — and throws it away afterwards. */
function compress(file,edge,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej();
      img.onload=()=>{
        const max=edge||1600, long=Math.max(img.width,img.height), k=long>max?max/long:1;
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>b?res(b):rej(),"image/jpeg",quality||0.7);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();
  r.onerror=()=>rej(); r.onload=()=>res(r.result); r.readAsDataURL(b)});
/* ---------- reading the receipt ----------
   Tesseract.js, pinned and vendored in ./vendor, is the one dependency in the app.
   It earns the exception by keeping rule 8: the reading happens in a worker on this
   phone, and no part of a receipt ever goes near a network. See BRIEF.md.

   It is about ten megabytes, so nothing loads until he actually photographs a
   receipt with the setting on, and it is never in the service worker's SHELL.
   Everything it fills in is a suggestion he can type over. */
const OCR_FILES={
  lib:"vendor/tesseract.min.js", worker:"vendor/worker.min.js", lang:"vendor",
  simd:"vendor/tesseract-core-simd-lstm.wasm.js", plain:"vendor/tesseract-core-lstm.wasm.js"
};
const ocrUrl=f=>new URL(f,location.href).href;   // the worker resolves from a blob: URL, so absolute
/* The SIMD core is twice the speed and every phone since about 2021 has it. The plain
   one is the fallback, and only ever one of the two is downloaded. */
function hasSimd(){
  try{ return WebAssembly.validate(new Uint8Array(
    [0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11])); }
  catch(e){ return false; }
}
let ocrWorker=null, ocrLoading=null;
function ocrLib(){
  if(self.Tesseract) return Promise.resolve(self.Tesseract);
  return new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src=OCR_FILES.lib; sc.onload=()=>self.Tesseract?res(self.Tesseract):rej();
    sc.onerror=()=>rej(); document.head.appendChild(sc);
  });
}
/* One worker, kept alive for the rest of the session so the second receipt in a chain
   costs nothing. The ten megabytes land once and the browser caches them after that. */
function ocrReady(onProgress){
  if(ocrWorker) return Promise.resolve(ocrWorker);
  if(ocrLoading) return ocrLoading;
  ocrLoading=ocrLib().then(T=>T.createWorker("eng",1,{
    workerPath:ocrUrl(OCR_FILES.worker),
    corePath:ocrUrl(hasSimd()?OCR_FILES.simd:OCR_FILES.plain),
    langPath:ocrUrl(OCR_FILES.lang),
    gzip:true,
    logger:m=>{ if(onProgress) onProgress(m); }
  })).then(w=>{ ocrWorker=w; ocrLoading=null; return w; })
    .catch(e=>{ ocrLoading=null; throw e; });
  return ocrLoading;
}
/* The stored photo is deliberately small and soft. Reading wants a bigger, sharper
   copy, which is used once and dropped. */
const readCopy=file=>compress(file,2000,0.92);

/* ---------- making sense of what came back ---------- */
/* A tired printer and a crumpled docket turn "31.90" into "31...90" or "31 , 90",
   so allow a smeared separator rather than lose the total over it. */
const MONEY=/(?:\$\s*)?(\d{1,3}(?:,\d{3})+|\d+)\s*[.,]{1,3}\s*(\d{2})(?!\d)/g;
function moneyIn(line){
  const out=[]; let m; MONEY.lastIndex=0;
  while((m=MONEY.exec(line))) out.push(parseFloat(m[1].replace(/,/g,"")+"."+m[2]));
  return out;
}
/* Lines that carry a number which is never the total. */
const NOT_TOTAL=/\bCHANGE\b|TENDER|ROUND|\bCASH\s*OUT\b/;
const MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};

const TOTAL_WORD=/\bTOTAL\b|\bAMOUNT\s+DUE\b|\bBALANCE\s+DUE\b/;
const GST_WORD=/\bGST\b|\bTAX\b/;
const INCL_GST=/(INCL|INC|INCLUDING)\s*\.?\s*(OF\s*)?GST/;
function readTotal(lines){
  let best=null;
  const keep=(v,rank)=>{ if(v>0&&(!best||rank>best.rank||(rank===best.rank&&v>best.v))) best={v,rank}; };
  lines.forEach((line,i)=>{
    const U=line.toUpperCase();
    if(NOT_TOTAL.test(U)) return;
    let vals=moneyIn(line);
    /* A total keyword whose figure didn't come through the camera: the figure is
       sometimes on the next line. Only take it when that line is a bare number —
       otherwise a smudged "TOTAL" quietly adopts the GST line underneath it. */
    const next=lines[i+1]||"";
    if(!vals.length&&TOTAL_WORD.test(U)&&!/[A-Za-z]/.test(next)) vals=moneyIn(next);
    if(!vals.length) return;
    const sub=/\bSUB\s*-?\s*TOTAL\b/.test(U);
    const tot=TOTAL_WORD.test(U);
    /* A figure sitting on a GST line is the GST, not the total — "TOTAL GST 4.09" very
       much included. "TOTAL INCL GST 45.00" is the one real exception. */
    if(GST_WORD.test(U)&&!INCL_GST.test(U)) return;
    /* Within a rank the biggest figure wins, which is the one that is really the total. */
    if(tot&&!sub) vals.forEach(v=>keep(v,3));
    else if(sub) vals.forEach(v=>keep(v,2));
    else vals.forEach(v=>keep(v,1));          // nothing labelled: the largest figure, usually right
  });
  return best?best.v:null;
}
/* An explicit GST line beats dividing by eleven: a docket with fresh food on it carries
   less GST than an eleventh, and claiming the eleventh would be overclaiming. */
function readGst(lines,total){
  for(const line of lines){
    const U=line.toUpperCase();
    if(!/\bGST\b|\bTAX\b/.test(U)) continue;
    if(/GST\s*FREE|NO\s*GST|GST\s*EXEMPT|TAX\s*INVOICE/.test(U)) continue;
    const v=moneyIn(line).filter(n=>n>0&&(!total||n<=total*0.2));   // a fifth is well past an eleventh
    if(v.length) return Math.max.apply(null,v);
  }
  return null;
}
function buildDate(d,mo,y){
  y=+y; if(y<100) y+=2000;
  if(!(d>=1&&d<=31&&mo>=1&&mo<=12&&y>=2000&&y<=2100)) return null;
  const iso=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const back=new Date(iso+"T00:00:00");
  return isoLocal(back)===iso?iso:null;                 // 31 February and friends
}
/* Australian receipts are day first. Anything in the future, or more than two years
   old, is a misread rather than a date. */
const datePlausible=iso=>iso<=today()&&iso>=addDays(today(),-730);
function readDate(text){
  const cands=[]; let m;
  const slash=/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/g;
  while((m=slash.exec(text))) cands.push([+m[1],+m[2],m[3]]);
  const named=/(\d{1,2})\s*[-\s]\s*([A-Za-z]{3})[A-Za-z]*\.?\s*[-,\s]\s*(\d{2,4})/g;
  while((m=named.exec(text))){ const mo=MONTHS[m[2].toUpperCase()]; if(mo) cands.push([+m[1],mo,m[3]]); }
  for(const c of cands){
    const dayFirst=buildDate(c[0],c[1],c[2]);
    if(dayFirst&&datePlausible(dayFirst)) return dayFirst;
    const monthFirst=buildDate(c[1],c[0],c[2]);         // only when day first didn't work out
    if(monthFirst&&datePlausible(monthFirst)) return monthFirst;
  }
  return null;
}
/* The shop name is usually in the first line or two. Optional, so don't try hard. */
function readSupplier(lines){
  for(const line of lines.slice(0,3)){
    const t=line.replace(/\s+/g," ").trim();
    if(t.length<3||t.length>40) continue;
    if(/\bABN\b|\bACN\b|TAX\s*INVOICE|\bRECEIPT\b|\bPH\b|PHONE|\bTEL\b/i.test(t)) continue;
    if((t.match(/[A-Za-z]/g)||[]).length<3) continue;
    if(/^\d/.test(t)) continue;                          // a street number, not a name
    return t;
  }
  return null;
}
function parseReceipt(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  const amount=readTotal(lines);
  const date=readDate(lines.join("\n"));
  /* A shop name on its own doesn't make it a receipt. Without a total or a date this
     was a photo of something else, and filling in a guess would be worse than nothing. */
  if(amount==null&&!date) return {amount:null,gst:null,date:null,supplier:null};
  return {amount, gst:readGst(lines,amount), date, supplier:readSupplier(lines)};
}

function dataToBlob(u){
  const c=u.indexOf(","), head=u.slice(0,c), bin=atob(u.slice(c+1));
  const type=(/:(.*?);/.exec(head)||[,"image/jpeg"])[1];
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type});
}

/* Australian GST is 10% built into the price, so the included part is a rounded eleventh. */
const gstOf=total=>Math.round((total/11)*100)/100;
const NEEDS_INVOICE=82.5;                       // ATO threshold for a valid tax invoice
const fyOf=i=>{ const y=+i.slice(0,4), m=+i.slice(5,7); return m>=7?y+1:y; };
const fyLabel=f=>(f-1)+"\u2013"+String(f).slice(2);   // 2025-26

/* ---------- the two streams ---------- */
function derive(){
  /* stream one: money set aside, which is what the goal is made of */
  const toSavings=S.income.reduce((s,i)=>s+i.toSavings,0);
  const repaid=S.repayments.reduce((s,r)=>s+r.amount,0);
  /* Corrections true the balance up to the real account: a fee, some interest, a transfer
     he forgot. They stay out of the weekly bars below — that isn't money he set aside. */
  const adjusted=S.adjustments.reduce((s,a)=>s+a.amount,0);
  const savings=toSavings+repaid+adjusted;

  /* each holding tracked on its own, then added up */
  const holdings=S.holdings.map(h=>{
    const put=S.income.reduce((s,i)=>s+((i.invest||{})[h.id]||0),0);
    const hist=S.investValues.filter(v=>v.hid===h.id);
    const lastV=hist.length?hist[hist.length-1]:null;
    /* Money paid in or pulled out after the last valuation moves the value with it,
       otherwise a fresh deposit would read as a loss until he revalues. */
    const since=lastV?S.income.reduce((s,i)=>
      s+(i.date>lastV.date?((i.invest||{})[h.id]||0):0),0):0;
    const value=lastV?lastV.value+since:put;
    return {h, put, value, growth:value-put, hist:hist.map(v=>v.value),
      lastAt:lastV?lastV.date:null};
  });
  const invested=holdings.reduce((s,x)=>s+x.put,0);
  const investVal=holdings.reduce((s,x)=>s+x.value,0);
  const growth=investVal-invested;
  const goalTotal=savings+investVal;

  /* stream two: spending money, a running balance that rolls over */
  const intoWallet=S.income.reduce((s,i)=>s+(i.amount-i.toSavings-investOf(i)),0);
  const spent=S.expenses.reduce((s,e)=>s+e.amount,0);
  const wallet=intoWallet-spent;

  /* bills due before the next payday, still unticked */
  const endOfWeek=weekEnd(today());
  let billsPending=0;
  S.recurring.forEach(r=>{ let d=r.next,g=0;
    while(d<=endOfWeek && g++<60){ billsPending+=r.amount; d=advance(d,r.freq); } });
  const safe=wallet-billsPending;

  const left=weeksBetween(today(),S.deadline);
  const gap=S.goal-goalTotal;
  const required=left>0?gap/left:gap;

  const byWeek={};
  S.income.forEach(i=>{const k=weekEnd(i.date);byWeek[k]=(byWeek[k]||0)+i.toSavings+investOf(i)});
  S.repayments.forEach(r=>{const k=weekEnd(r.date);byWeek[k]=(byWeek[k]||0)+r.amount});
  const weeks=Object.keys(byWeek).sort().map(k=>({week:k,put:byWeek[k]}));
  const recent=weeks.slice(-4);
  const rate=recent.length?recent.reduce((s,w)=>s+w.put,0)/recent.length:null;

  const owedTotal=S.owed.reduce((s,o)=>s+o.amount,0);
  return {savings,repaid,adjusted,invested,investVal,growth,holdings,goalTotal,wallet,billsPending,safe,
    left,gap,required,weeks,rate,owedTotal,spent,
    projected: rate===null?null:goalTotal+rate*left};
}

function dueList(){
  const out=[];
  S.recurring.forEach(r=>{ let d=r.next,g=0;
    while(d<=today() && g++<60){ out.push({r,date:d}); d=advance(d,r.freq); } });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* ---------- render ---------- */
function warnBanner(){
  if(storageOK) return "";
  return `<div class="card due" style="border-color:#c98f7a"><h2>This browser won't save anything</h2>
    <p class="sub" style="margin-bottom:0">Nothing you type will survive closing the tab. Try Samsung Internet
      instead of Chrome, or turn off private browsing.</p></div>`;
}
/* Everything he has typed in, which is what a lost phone would cost him. */
function entriesIn(o){
  if(!o) return 0;
  return ["income","expenses","recurring","owed","repayments","adjustments","investValues"]
    .reduce((n,k)=>n+((o[k]||[]).length),0);
}
const entryCount=()=>entriesIn(S);
const newEntries=()=>Math.max(0,entryCount()-(S.lastBackupN||0));
const newPhotos=()=>Math.max(0,photoCount()-(S.lastPhotoBackupN||0));
const daysSince=i=>i?Math.round((new Date(today()+"T00:00:00")-new Date(i+"T00:00:00"))/864e5):null;
const plural=(n,one,many)=>n+" "+(n===1?one:many||one+"s");
const ago=d=>d===null?"":d===0?", taken today":d===1?", taken yesterday":", "+plural(d,"day")+" ago";
const FIGURES_DUE=14, PHOTOS_DUE=90;                 // photos are big; a quarter is plenty

/* Says what is at stake rather than that time has passed, because "it has been a
   while" is easy to scroll past and "nineteen entries" is not. Still only a card. */
function backupNudge(){
  if(!storageOK||!S||S.income.length<2||nudgeHushed) return "";
  const dFig=daysSince(S.lastBackup), dPho=daysSince(S.lastPhotoBackup);
  const nFig=newEntries(), nPho=newPhotos();
  const figDue=nFig>0&&(dFig===null||dFig>=FIGURES_DUE);
  const phoDue=nPho>0&&(dPho===null||dPho>=PHOTOS_DUE);
  if(!figDue&&!phoDue) return "";
  /* Never backed up, with a real history behind him, is the genuinely exposed case. */
  const first=S.income.map(i=>i.date).sort()[0];
  const never=S.lastBackup==null&&daysSince(first)>7;
  const bits=[];
  if(nFig) bits.push(plural(nFig,"entry","entries"));
  if(nPho) bits.push(plural(nPho,"receipt photo"));
  return `<div class="card"${never?' style="border-color:#c98f7a"':""}>
    <h2>${never?"Nothing here has ever been backed up":"Worth taking a backup"}</h2>
    <p class="sub">${never
      ? bits.join(" and ")+" live on this phone and nowhere else. If it's lost, wiped or replaced, they go with it."
      : bits.join(" and ")+" since your last "+(figDue?"backup":"photo backup")+ago(figDue?dFig:dPho)+"."}</p>
    ${phoDue&&nFig?`<p class="note" style="margin-top:0">The figures file is small and worth taking often.
      The photos are much bigger — once a quarter, or after a run of claimable spending, is plenty.</p>`:""}
    ${shareOK?`<button class="btn" data-act="share-backup">Send a copy off this phone</button>`:""}
    <button class="btn ghost" data-act="backup">Download a backup file</button>
    ${phoDue?`<button class="btn ghost" data-act="${shareOK?"share-photos":"backup-photos"}">${
      shareOK?"Send your receipt photos off this phone":"Download your receipt photos"} (${nPho} new)</button>`:""}
    <button class="link" data-act="hush-nudge">Not now</button>
  </div>`;
}
/* One place that knows what a figures backup is, so the button, the share sheet and
   the reminder can't drift apart. */
function figuresFile(){
  return {name:"money-weeks-backup-"+today()+".json",
    text:JSON.stringify(Object.assign({},S,
      {receiptPhotos:"not in this file - use Download your receipt photos for those"}),null,2)};
}
function markFiguresBackedUp(){ S.lastBackup=today(); S.lastBackupN=entryCount(); save(); render(); }
/* Only a whole-library export counts as having the photos safe. A single financial
   year is a useful thing to send an accountant, but treating it as a backup would
   quietly tell him the other years are covered when they aren't. */
function markPhotosBackedUp(fy){
  if(fy!=="all"){ render(); return; }
  S.lastPhotoBackup=today(); S.lastPhotoBackupN=photoCount(); save(); render();
}
/* Gathers a financial year of photos into one file. Shared by the download and the
   share sheet; unchanged in what it produces. */
function photosFile(fy){
  const withPhoto=photosIn(fy);
  if(!withPhoto.length) return Promise.resolve(null);
  return Promise.all(withPhoto.map(e=>photoGet(e.id).then(b=>b?blobToData(b).then(u=>[e.id,u]):null)
    .catch(()=>null))).then(pairs=>{
      const photos={}; pairs.forEach(x=>{ if(x) photos[x[0]]=x[1]; });
      const n=Object.keys(photos).length;
      if(!n) return null;
      const label=fy==="all"?"all":fyLabel(+fy);
      return {n, name:"money-weeks-receipts-"+label+"-"+today()+".json",
        text:JSON.stringify({type:"money-weeks-receipts",saved:today(),fy:label,photos})};
    });
}
/* The share sheet is the point of this: a backup that only ever sits on the phone it
   is backing up is not a backup. Cancelling is not a failure and isn't recorded. */
function shareFile(file,then){
  let f;
  try{ f=new File([file.text],file.name,{type:"application/json"}); }
  catch(e){ toast("This browser can't send files. Use the download button."); return; }
  if(!(navigator.canShare&&navigator.canShare({files:[f]}))){
    toast("This browser can't send files. Use the download button."); return;
  }
  navigator.share({files:[f],title:"Money Weeks backup"})
    .then(()=>{ then(); toast("Sent. Keep it somewhere that isn't this phone."); })
    .catch(err=>{ if(err&&err.name==="AbortError") return;      // he changed his mind
      toast("Couldn't send it. The download button still works."); });
}
function render(){
  const y=window.scrollY;
  document.getElementById("app").innerHTML = S ? screenMain() : (warnBanner()+screenSetup());
  wire(); window.scrollTo(0,y);
}

}

function screenMain(){
  const d=derive();
  const body = tab==="pay"?viewPay(d)
    :tab==="spend"?(spendSub==="claim"?viewClaim():viewSpend(d))
    :tab==="goal"?viewGoal(d)
    :tab==="history"?viewHistory():viewSetup();
  const tabs=[["pay","Pay"],["spend","Spending"],["goal","Goal"],["history","History"],["setup","Setup"]];
  return warnBanner()+hero(d)+`<div class="tabs" role="tablist">`+
    tabs.map(([id,l])=>`<button class="tab" role="tab" data-act="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join("")+
    `</div>`+body;
}

function hero(d){
  const bars=d.weeks.slice(-10);
  const max=Math.max(d.required||0,...bars.map(b=>b.put),1);
  const onTrack=d.rate!==null&&d.rate>=d.required;
  const spare=Math.max(0,d.safe);
  return `<div class="hero">
    <div class="hero-top">
      <div><div class="total num">${money(d.goalTotal)}</div><div class="of">towards ${money(S.goal)}</div></div>
      <div class="countdown num"><b>${d.left}</b>${d.left===1?"week left":"weeks left"}</div>
    </div>
    <div class="bars-box">${ bars.length ? `
      <div class="bars">
        <div class="target" style="bottom:${Math.min(100,(d.required/max)*100)}%"><span>${money(Math.max(0,d.required))} a week needed</span></div>
        ${bars.map(b=>`<div class="bar" style="height:${Math.max(2,(b.put/max)*100)}%" title="${shortDate(b.week)}: ${money(b.put)}"></div>`).join("")}
      </div>
      <div class="legend"><span>${shortDate(bars[0].week)}</span><span>put away each week</span><span>${shortDate(bars[bars.length-1].week)}</span></div>`
      : `<div class="hint">Record a pay and this fills in with what you put away each week.</div>`}
    </div>
    <div class="verdict">
      <div class="verdict-main">
        <span class="dot" style="background:${d.rate===null?"#7f96a8":onTrack?"#4ec2a8":"#e08b76"}"></span>
        ${d.rate===null?"Nothing put away yet":onTrack?"On track, "+money(d.rate-d.required)+" a week clear"
          :"Short by "+money(d.required-d.rate)+" a week"}
      </div>
      <div class="verdict-sub">Savings ${money(d.savings)} &middot; investments ${money(d.investVal)}${
        d.rate!==null?" &middot; lately "+money(d.rate)+" a week":""}</div>
      ${d.owedTotal>0?`<div class="verdict-sub" style="margin-top:4px">${money(d.owedTotal)} owed to you, not counted until it's paid.</div>`:""}
    </div>
  </div>
  <div class="wallet${d.safe<0?" over":""}">
    <div class="wallet-top">
      <div><div class="lbl">Left to spend</div>
        <p class="sub">${ d.billsPending>0
          ? money(d.wallet)+" in hand, less "+money(d.billsPending)+" of bills due"
          : "rolls over to next "+DAYS[payDay()] }</p></div>
      <div class="amt num">${money(d.safe)}</div>
    </div>
    ${ spare>0 ? `<button class="sweep" data-act="sweep">Put ${money(spare)} of this into savings</button>`:"" }
  </div>`;
}

/* ---------- pay ---------- */
function potOptions(sel,d){
  const pots=[{id:"spend",name:"Spending money ("+money(d.safe)+")"},
              {id:"save", name:"Savings ("+money(d.savings)+")"}]
    .concat(d.holdings.map(x=>({id:x.h.id,name:x.h.name+" ("+money(x.value)+")"})));
  return pots.map(p=>`<option value="${p.id}"${p.id===sel?" selected":""}>${esc(p.name)}</option>`).join("");
}

function viewPay(d){
  const pre=movePrefill?movePrefill.toFixed(2):"";
  return backupNudge()+`<div class="card">
    <h2>${moveMode?"Move money":"Money in"}</h2>
    <p class="sub">${ moveMode
      ? "Shift money you already have between spending, savings and each investment. Take from savings to spend, buy an investment out of savings, sell one back into savings &mdash; whichever way round."

/* ---------- spending ---------- */
function viewSpend(d){
  const due=dueList(), dueTotal=due.reduce((s,x)=>s+x.r.amount,0);
  const shown=filter?S.expenses.filter(e=>e.cat===filter):S.expenses;
  const map={}; shown.forEach(e=>{const k=weekEnd(e.date);(map[k]=map[k]||[]).push(e)});
  const groups=Object.keys(map).sort().reverse().map(k=>({week:k,
    items:map[k].sort((a,b)=>a.date<b.date?1:-1), total:map[k].reduce((s,e)=>s+e.amount,0)}));
  const thisWeek=groups.find(g=>g.week===weekEnd(today()));
  const last4=groups.slice(0,4);
  const avg=last4.length?last4.reduce((s,g)=>s+g.total,0)/last4.length:0;
  const claim=S.expenses.filter(e=>e.claimable);
  const claimable=claim.reduce((s,e)=>s+e.amount,0);
  const claimGst=claim.reduce((s,e)=>s+(e.gst||0),0);

  return `
  ${ due.length?`<div class="card due">
    <h2>${due.length===1?"1 bill due":due.length+" bills due"}</h2>
    <p class="sub">These come out of your spending money. Nothing is taken until you tick it off.</p>
    ${due.map((x,i)=>`<div class="exp">
      <span class="sw" style="background:${catOf(x.r.cat).color}"></span>
      <div class="expmain"><div class="expwhat">${esc(x.r.name)}</div>
        <div class="expmeta">due ${shortDate(x.date)} &middot; ${freqLabel(x.r.freq)}</div></div>
      <div class="expamt num">${money(x.r.amount,true)}</div>
      <button class="mini solid" data-act="log-due" data-i="${i}">Paid</button>
      <button class="mini" data-act="skip-due" data-i="${i}">Skip</button>
    </div>`).join("")}
    ${due.length>1?`<button class="btn" data-act="log-all-due">Log all ${due.length}, ${money(dueTotal)}</button>`:""}
  </div>`:""}

  <div class="card">
    <h2>Add an expense</h2>
    <p class="sub">Comes straight off your spending money. Ten seconds, do it at the till.</p>
    <div class="row"><label for="s-amt">How much</label>
      <div class="money"><span>$</span><input id="s-amt" class="in" inputmode="decimal" placeholder="0.00"></div></div>
    <div style="padding:7px 0"><input id="s-what" class="txt" placeholder="What was it for" aria-label="What was it for"></div>
    <div class="chips" id="s-cats">${S.categories.map((c,i)=>`<button class="chip" data-act="pick-cat" data-id="${c.id}" aria-pressed="${i===0}"><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</button>`).join("")}</div>
    <div class="row" style="margin-top:8px"><label for="s-date">When</label>
      <div class="money"><input id="s-date" class="in plain" type="date" value="${today()}"></div></div>
    <button class="link" data-act="receipt-mode" id="rc-toggle">${receiptMode
      ? "Not a work receipt after all" : "It's a work receipt \u2014 photo and GST"}</button>
    ${receiptBlock()}
    <button class="btn" data-act="add-exp">Add expense</button>
    <button class="link" data-act="show-regulars">${showRegulars?"Hide bills":"Set up a regular bill"}</button>
    ${showRegulars?regularsBlock():""}
  </div>

  <div class="card">
    <div class="split" style="margin-top:0">
      <div class="splitline"><span>Spent this pay week</span><b class="num">${money(thisWeek?thisWeek.total:0)}</b></div>
      <div class="splitline"><span>Weekly average lately</span><b class="num">${money(avg)}</b></div>
      <div class="splitline big"><span>Left to spend</span><b class="num ${d.safe<0?"down":""}">${money(d.safe)}</b></div>
    </div>
    ${claim.length?`<p class="note">${money(claimable)} of claimable work spending, ${money(claimGst,true)} of GST in it.</p>`:""}
    <button class="link" data-act="claim">Claimable spending and GST${claim.length?" ("+claim.length+")":""}</button>
    ${d.safe>0?`<button class="btn ghost" data-act="sweep">Move ${money(d.safe)} into savings</button>`:""}
    <button class="link" data-act="reconcile">The real figure is different, fix it</button>
    <div class="chips">
      <button class="chip" data-act="filter" data-id="" aria-pressed="${filter===null}">Everything</button>
      ${S.categories.map(c=>`<button class="chip" data-act="filter" data-id="${c.id}" aria-pressed="${filter===c.id}"><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>This pay week</h2>
    <p class="sub">Week to ${shortDate(weekEnd(today()))}. Everything before it is in History.</p>
    ${ !thisWeek?`<div class="empty">${filter?"Nothing in that category this week.":"Nothing spent this week yet."}</div>`
      : `${(function(){const byCat={};thisWeek.items.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
          return `<div class="stack">${Object.keys(byCat).map(id=>`<div style="width:${(byCat[id]/thisWeek.total)*100}%;background:${catOf(id).color}"></div>`).join("")}</div>`;})()}
        ${thisWeek.items.map(e=>`<div class="exp">
          <span class="sw" style="background:${catOf(e.cat).color}"></span>
          <div class="expmain"><div class="expwhat">${esc(e.what)}${e.photo?" \uD83D\uDCF7":""}</div>
            <div class="expmeta">${shortDate(e.date)} &middot; ${esc(catOf(e.cat).name)}${
              e.claimable?" &middot; claimable":""}</div></div>
          <div class="expamt num">${money(e.amount,true)}</div>
          <button class="again" data-act="again-exp" data-id="${e.id}" aria-label="Log again today">&#8635;</button>
          <button class="x" data-act="del-exp" data-id="${e.id}" aria-label="Delete">&times;</button>
        </div>`).join("")}` }
    <button class="link" data-act="tab" data-tab="history">Every other week is in History</button>
    ${S.expenses.length?`<button class="btn ghost" data-act="csv">Download spending as a spreadsheet</button>`:""}
  </div>`;
}

/* ---------- claimable spending ---------- */
function viewClaim(){
  const all=S.expenses.filter(e=>e.claimable).sort((a,b)=>a.date<b.date?1:-1);
  const years=[]; all.forEach(e=>{ const f=fyOf(e.date); if(years.indexOf(f)<0) years.push(f); });
  years.sort().reverse();
  const list=claimFY==="all"?all:all.filter(e=>fyOf(e.date)===+claimFY);
  const total=list.reduce((s,e)=>s+e.amount,0), gst=list.reduce((s,e)=>s+(e.gst||0),0);
  const short=list.filter(e=>e.amount>NEEDS_INVOICE&&!e.invoiceHeld).length;

  return `<div class="card">
    <button class="link" data-act="unclaim">&larr; Back to spending</button>
    <h2>Claimable work spending</h2>
    <p class="sub">Every expense you marked claimable, with the GST in it. Financial years run 1 July to 30 June.</p>
    <div class="chips">
      <button class="chip" data-act="fy" data-id="all" aria-pressed="${claimFY==="all"}">All time</button>
      ${years.map(f=>`<button class="chip" data-act="fy" data-id="${f}" aria-pressed="${claimFY===String(f)}">${fyLabel(f)}</button>`).join("")}
    </div>
    <div class="split">
      <div class="splitline"><span>Receipts</span><b class="num">${list.length}</b></div>
      <div class="splitline"><span>GST in them</span><b class="num">${money(gst,true)}</b></div>
      <div class="splitline big"><span>Spent, including GST</span><b class="num">${money(total,true)}</b></div>
    </div>
    ${short?`<div class="flag">${short===1?"One receipt is":short+" receipts are"} over ${money(NEEDS_INVOICE,true)}
      without a tax invoice held. Tap it and tick it off once you've found the invoice.</div>`:""}
    ${list.length?`<button class="btn ghost" data-act="claim-csv">Download for your accountant</button>`:""}
  </div>

  <div class="card">
    ${ list.length===0?`<div class="empty">Nothing marked claimable${claimFY==="all"?" yet. Tick \u201cIt's a work receipt\u201d when you add an expense.":" in that year."}</div>`
      : list.map(e=>{
        const open=!!openRows[e.id], needs=e.amount>NEEDS_INVOICE&&!e.invoiceHeld;
        return `<div>
          <button class="hrow" data-act="toggle-row" data-id="${e.id}" aria-expanded="${open}">
            <span class="hdate num">${shortDate(e.date)}</span>
            <span class="hwhat">${esc(e.supplier||e.what)}${e.photo?" \uD83D\uDCF7":""}${needs?" \u26a0":""}
              <span class="weeksub">${esc(e.what)} &middot; GST ${money(e.gst||0,true)}</span></span>
            <span class="hamt num">${money(e.amount,true)}</span>
          </button>
          ${open?`<div class="hdet">
            <div class="subtle">${esc(catOf(e.cat).name)} &middot; ${e.noGst?"no GST on this one":"GST "+money(e.gst||0,true)}
              &middot; ${e.amount>NEEDS_INVOICE?(e.invoiceHeld?"tax invoice held":"needs a proper tax invoice"):"under "+money(NEEDS_INVOICE,true)+", a receipt is enough"}</div>
            ${e.readFields&&e.readFields.length?`<div class="flag">Read off the photo and never checked:
              ${e.readFields.map(esc).join(", ")}. Worth a look against the picture below.</div>`:""}
            ${e.photo?`<img class="thumb" data-photo="${e.id}" alt="Photo of the receipt from ${esc(e.supplier||e.what)}">`:""}
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="mini${e.invoiceHeld?" solid":""}" data-act="held-toggle" data-id="${e.id}">${
                e.invoiceHeld?"Tax invoice held":"Mark invoice held"}</button>
              <button class="mini" data-act="del-exp" data-id="${e.id}">Delete</button>
            </div>
          </div>`:""}
        </div>`;}).join("") }
    <p class="note">This is a record of what you spent, not tax advice. What's actually claimable is between you
      and your accountant.</p>
  </div>`;
}

/* ---------- history ---------- */
const HIST=[["all","All"],["in","Money in"],["out","Spending"],["move","Moves"],["inv","Investments"]];
const HCOL={in:"#176b5c",out:"#b23f2a",move:"#4a6d8c",inv:"#8a6bbf"};

/* One timeline out of every list. Nothing here derives a figure — it only reports what
   was recorded, so a row can be deleted straight from it. */
function events(){
  const out=[];
  S.income.forEach(i=>{
    const inv=investOf(i);
    if(i.amount>0) out.push({id:i.id,del:"del-pay",type:"in",date:i.date,amount:i.amount,
      what:i.opening?"Opening balance":"Pay",
      detail:money(i.toSavings,true)+" to savings \u00b7 "+money(inv,true)+" invested \u00b7 "+
        money(i.amount-i.toSavings-inv,true)+" to spend"});
    else out.push({id:i.id,del:"del-pay",type:"move",date:i.date,amount:null,
      what:i.moveLabel||"Moved across",
      detail:"Money changed pots. Nothing came in and nothing was spent."});
  });
  S.expenses.forEach(e=>out.push({id:e.id,del:"del-exp",type:"out",date:e.date,amount:-e.amount,
    what:e.what,hunt:e.supplier||"",photo:!!e.photo,
    detail:catOf(e.cat).name+(e.bill?" \u00b7 regular bill":"")+(e.supplier?" \u00b7 "+e.supplier:"")+
      (e.claimable?" \u00b7 claimable, GST "+money(e.gst||0,true):"")}));
  S.repayments.forEach(r=>out.push({id:r.id,del:"del-repaid",type:"in",date:r.date,amount:r.amount,
    what:r.who+" paid you back",hunt:r.who,detail:"Into savings, and off what they owed you."}));
  S.investValues.forEach(v=>{ const h=S.holdings.find(x=>x.id===v.hid);
    out.push({id:v.id,del:"del-val",type:"inv",date:v.date,amount:null,
      what:(h?h.name:"An investment")+" valued at "+money(v.value),
      detail:"What it was worth that day. Valuing doesn't move any money."}); });
  S.adjustments.forEach(a=>out.push({id:a.id,del:"del-adj",type:"inv",date:a.date,amount:null,
    what:"Savings correction "+(a.amount>=0?"+":"\u2212")+money(Math.abs(a.amount),true),
    detail:(a.note?a.note+". ":"")+"A correction, not money you put away."}));
  return out.sort((a,b)=>a.date===b.date?0:(a.date<b.date?1:-1));
}

function viewHistory(){
  return `<div class="card">
    <h2>History</h2>
    <p class="sub">Everything you've recorded, newest first, a pay week at a time. Tap a line for the detail.</p>
    <div class="chips">${HIST.map(([id,l])=>`<button class="chip" data-act="hfilter" data-id="${id}"
      aria-pressed="${histFilter===id}">${l}</button>`).join("")}</div>
    <div style="padding:8px 0 2px"><input id="h-search" class="txt" placeholder="Search what and who"
      value="${esc(histSearch)}" aria-label="Search history"></div>
    <div id="hist-body">${histBody()}</div>
  </div>`;
}

/* Rendered on its own so typing in the search box can refresh the list without a
   re-render taking the keyboard with it. */
function histBody(){
  const q=histSearch.trim().toLowerCase();
  const list=events().filter(e=>(histFilter==="all"||e.type===histFilter)&&
    (!q||(e.what+" "+(e.hunt||"")+" "+e.detail).toLowerCase().indexOf(q)>-1));
  if(!list.length) return `<div class="empty">${q||histFilter!=="all"?"Nothing matches that."
    :"Nothing recorded yet."}</div>`;
  const map={}; list.forEach(e=>{ const k=weekEnd(e.date); (map[k]=map[k]||[]).push(e); });
  const now=weekEnd(today());
  return Object.keys(map).sort().reverse().map(k=>{
    /* Searching or filtering means he's looking for something, so the weeks that still
       have rows in them open up rather than making him tap through each one. */
    const items=map[k], open=openHist[k]??(k===now||!!q||histFilter!=="all");
    let inn=0, out=0, put=0;
    items.forEach(e=>{ if(e.amount>0) inn+=e.amount; if(e.amount<0) out-=e.amount; });
    /* Put away is read off the real lists, not the filtered rows, so the week still
       summarises itself honestly while a filter is on. */
    S.income.forEach(i=>{ if(weekEnd(i.date)===k) put+=i.toSavings+investOf(i); });
    S.repayments.forEach(r=>{ if(weekEnd(r.date)===k) put+=r.amount; });
    return `<div>
      <button class="weekhead" data-act="toggle-hist" data-week="${k}" aria-expanded="${open}">
        <span class="caret">${open?"&#9662;":"&#9656;"}</span>
        <span class="weekname">Week to ${shortDate(k)}${k===now?" &middot; this week":""}
          <span class="weeksub">in ${money(inn)} &middot; out ${money(out)} &middot; put away ${money(put)}</span></span>
      </button>
      ${open?items.map(histRow).join(""):""}
    </div>`;
  }).join("");
}

function histRow(e){
  const open=!!openRows[e.id];
  return `<div>
    <button class="hrow" data-act="toggle-row" data-id="${e.id}" aria-expanded="${open}">
      <span class="sw" style="background:${HCOL[e.type]}"></span>
      <span class="hdate num">${shortDate(e.date)}</span>
      <span class="hwhat">${esc(e.what)}${e.photo?" \uD83D\uDCF7":""}</span>
      <span class="hamt num ${e.amount<0?"down":e.amount>0?"up":""}">${
        e.amount==null?"":(e.amount>0?"+":"\u2212")+money(Math.abs(e.amount),true)}</span>
    </button>
    ${open?`<div class="hdet">
      <div class="subtle">${esc(e.detail)}</div>
      ${e.photo?`<img class="thumb" data-photo="${e.id}" alt="Photo of the receipt">`:""}
      <button class="mini" data-act="${e.del}" data-id="${e.id}" style="margin-top:10px">Delete this</button>
    </div>`:""}
  </div>`;
}

/* What the browser has actually promised about this data. Neither answer is dressed
   up: knowing which situation he is in is the whole point of showing it. */
function persistLine(){
  if(S.persisted===true) return `<p class="note" style="margin-top:0">This phone has been asked to keep
    this app's data and agreed, so it won't be cleared to make room for something else.
    It can still go if you clear the browser's site data, or if the phone is lost or replaced
    — that's what a copy off the phone is for.</p>`;
  if(S.persisted===false) return `<div class="flag">This phone hasn't promised to keep this app's data,
    so it may be cleared if storage runs low. Nothing is wrong, but it makes a copy off the phone
    matter more.</div>`;
  return `<p class="note" style="margin-top:0">This browser can't say whether it will keep this app's
    data if storage runs low, so treat a copy off the phone as the thing keeping it safe.</p>`;
}
